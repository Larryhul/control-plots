name: 项目检查

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  control-tests:
    name: 控制系统算例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 检查 JavaScript 语法
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: 核对教材与边界算例
        run: npm test

  browser-tests:
    name: 浏览器回归（Chromium、Firefox、WebKit）
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: 安装测试依赖
        run: npm ci
      - name: 验证图表、交互与无障碍规则
        # Firefox 要求浏览器进程和用户目录归同一用户所有。
        run: runuser -u pwuser -- npm run test:browser -- --output /tmp/control-plots-browser-tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: /tmp/control-plots-browser-tests/
          if-no-files-found: ignore
